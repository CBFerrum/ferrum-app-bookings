# Bookings' connector with Commerce: deposits taken online when guests book, refunded by each
# service's terms when a booking is cancelled. Offered where both are installed.
id: bookings-payments
name: Booking Deposits
version: 0.2.0
publisher: cbferrum
summary: Take a deposit when a guest books a paid service, and refund it by the service's terms when the booking is cancelled
categories: [sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-bookings
support: https://github.com/CBFerrum/ferrum-app-bookings/issues
runtime: native
platform: ">=0.3.2, <0.4"
requires: {bookings: ">=0.3", commerce: ">=0.7"}
packages: [bookings_payments]
uninstall: ask
