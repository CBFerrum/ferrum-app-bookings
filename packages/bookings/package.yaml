package: bookings
version: 0.1.0
label: Bookings
description: "Appointment scheduling: services, staff and resources, availability, a public booking page, reminders, reschedules and paid bookings"
depends: [core, selling, accounting]

modules:
  - name: bookings
    label: Bookings
    icon: calendar-clock
    order: 48
    items: [Booking, BookingService, BookingStaff, StaffTimeOff, BookingResource, BookingSettings,
            report:bookings_summary, report:bookings_attendance, report:bookings_staff_utilization]

# What a personal-data request exports and erases for a guest (their email): who booked and what
# they wrote; the time the booking held stays.
personal_data:
  - {entity: Booking, match: guest_email, phone: guest_phone, name: guest_name, erase: [guest_name, guest_email, guest_phone, guest_language, answers, notes, cancellation_reason]}
roles:
  - name: Bookings Manager
    description: Runs the booking calendar — services, staff, working hours, time off, resources, settings and every booking (confirm, reschedule, cancel, invoice).
    permissions:
      - {entity: Booking, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: BookingService, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: BookingStaff, read: true, write: true, create: true, delete: true, export: true}
      - {entity: StaffTimeOff, read: true, write: true, create: true, delete: true, export: true}
      - {entity: BookingResource, read: true, write: true, create: true, delete: true}
      - {entity: BookingSettings, read: true, write: true, create: true}
      - {entity: Customer, read: true, write: true, create: true}
      - {entity: CustomerGroup, read: true}
      - {entity: Item, read: true}
      - {entity: Company, read: true}
      - {entity: SalesInvoice, read: true, create: true}
  - name: Bookings User
    description: A staff member taking appointments — sees and works their own bookings (assigned to them or made by them) and enters their own time off.
    permissions:
      - {entity: Booking, read: true, write: true, create: true, if_owner: true}
      - {entity: BookingService, read: true}
      - {entity: BookingStaff, read: true}
      - {entity: StaffTimeOff, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: BookingResource, read: true}
      - {entity: BookingSettings, read: true}
      - {entity: Customer, read: true}

# Every message Bookings sends: a template an administrator edits, resets and translates (Settings, Message templates). Times arrive written in the guest's or staff member's zone.
messages:
  - key: bookings.guest_requested
    label: "To a guest: booking request received"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link]
    languages:
      en:
        email:
          subject: "Booking request received: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>We have your booking request and will confirm it shortly.</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.location_type or doc.location %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Where</td><td>{% if doc.location_type %}{{ doc.location_type }}{% endif %}{% if doc.location_type and doc.location %}: {% endif %}{% if doc.location %}{{ doc.location }}{% endif %}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table><p><a href="{{ values.manage_link }}">View, reschedule or cancel</a> &middot; <a href="{{ values.calendar_link }}">Add to calendar</a></p>
  - key: bookings.guest_confirmed
    label: "To a guest: booking confirmed"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link]
    languages:
      en:
        email:
          subject: "Booking confirmed: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>Your booking is confirmed.</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.location_type or doc.location %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Where</td><td>{% if doc.location_type %}{{ doc.location_type }}{% endif %}{% if doc.location_type and doc.location %}: {% endif %}{% if doc.location %}{{ doc.location }}{% endif %}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table><p><a href="{{ values.manage_link }}">View, reschedule or cancel</a> &middot; <a href="{{ values.calendar_link }}">Add to calendar</a></p>
  - key: bookings.guest_waitlisted
    label: "To a guest: on the waitlist"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link]
    languages:
      en:
        email:
          subject: "On the waitlist: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>The class is full, so you are on its waitlist. We will write as soon as a seat frees up.</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.location_type or doc.location %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Where</td><td>{% if doc.location_type %}{{ doc.location_type }}{% endif %}{% if doc.location_type and doc.location %}: {% endif %}{% if doc.location %}{{ doc.location }}{% endif %}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table><p><a href="{{ values.manage_link }}">View, reschedule or cancel</a> &middot; <a href="{{ values.calendar_link }}">Add to calendar</a></p>
  - key: bookings.guest_rescheduled
    label: "To a guest: booking moved"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link]
    languages:
      en:
        email:
          subject: "Booking moved: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>Your booking has a new time.</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.location_type or doc.location %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Where</td><td>{% if doc.location_type %}{{ doc.location_type }}{% endif %}{% if doc.location_type and doc.location %}: {% endif %}{% if doc.location %}{{ doc.location }}{% endif %}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table><p><a href="{{ values.manage_link }}">View, reschedule or cancel</a> &middot; <a href="{{ values.calendar_link }}">Add to calendar</a></p>
  - key: bookings.guest_reminder
    label: "To a guest: reminder"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link]
    languages:
      en:
        email:
          subject: "Reminder: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>This is a reminder of your booking.</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.location_type or doc.location %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Where</td><td>{% if doc.location_type %}{{ doc.location_type }}{% endif %}{% if doc.location_type and doc.location %}: {% endif %}{% if doc.location %}{{ doc.location }}{% endif %}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table><p><a href="{{ values.manage_link }}">View, reschedule or cancel</a> &middot; <a href="{{ values.calendar_link }}">Add to calendar</a></p>
  - key: bookings.guest_cancelled
    label: "To a guest: booking cancelled"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link]
    languages:
      en:
        email:
          subject: "Booking cancelled: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>Your booking is cancelled.</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr>{% if doc.cancellation_reason %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reason</td><td>{{ doc.cancellation_reason }}</td></tr>{% endif %}</table>
  - key: bookings.guest_refunded
    label: "To a guest: deposit refunded"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link]
    languages:
      en:
        email:
          subject: "Deposit refunded: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>Your deposit arrived after the booking's time was released, and the time has since been booked. Your deposit is being refunded.</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table>
  - key: bookings.guest_deposit_due
    label: "To a guest: deposit due"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link, deposit, pay_by, pay_link]
    languages:
      en:
        email:
          subject: "Deposit due: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>A deposit of {{ values.deposit }} confirms your booking.{% if values.pay_by %} The time is held for you until {{ values.pay_by }}.{% endif %}</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.location_type or doc.location %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Where</td><td>{% if doc.location_type %}{{ doc.location_type }}{% endif %}{% if doc.location_type and doc.location %}: {% endif %}{% if doc.location %}{{ doc.location }}{% endif %}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table><p><a href="{{ values.pay_link }}">Pay the deposit</a></p>
  - key: bookings.guest_expired
    label: "To a guest: booking released"
    entity: Booking
    category: operational
    channels: [email]
    values: [when, until, manage_link, calendar_link, deposit, pay_by, pay_link]
    languages:
      en:
        email:
          subject: "Booking released: {{ doc.service_name }}, {{ values.when }}"
          body: >-
            <p>Hello {% if doc.guest_name %}{{ doc.guest_name }}{% else %}there{% endif %},</p><p>The deposit for this booking was not paid in time, so its time was released.{% if values.pay_link %} A deposit paid now confirms it if the time is still free, and is refunded if not.{% endif %}</p><table style="border-collapse:collapse"><tr><td style="padding:2px 12px 2px 0;color:#57606a">What</td><td>{{ doc.service_name }}</td></tr><tr><td style="padding:2px 12px 2px 0;color:#57606a">When</td><td>{{ values.when }}</td></tr>{% if values.until %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Until</td><td>{{ values.until }}</td></tr>{% endif %}{% if doc.staff_name %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">With</td><td>{{ doc.staff_name }}</td></tr>{% endif %}{% if doc.seats and doc.seats > 1 %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Seats</td><td>{{ doc.seats }}</td></tr>{% endif %}<tr><td style="padding:2px 12px 2px 0;color:#57606a">Reference</td><td>{{ doc.number }}</td></tr></table>{% if values.pay_link %}<p><a href="{{ values.pay_link }}">Pay the deposit</a></p>{% endif %}
  - key: bookings.staff_new
    label: "To staff: new booking"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when]
    languages:
      en:
        inapp:
          title: "New booking: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}"
          text: "{{ values.when }} · {{ doc.number }}"
  - key: bookings.staff_awaits_confirmation
    label: "To staff: to confirm"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when]
    languages:
      en:
        inapp:
          title: "To confirm: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}"
          text: "{{ values.when }} · {{ doc.number }}"
  - key: bookings.staff_rescheduled
    label: "To staff: booking moved"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when]
    languages:
      en:
        inapp:
          title: "Booking moved: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}"
          text: "{{ values.when }} · {{ doc.number }}"
  - key: bookings.staff_cancelled
    label: "To staff: booking cancelled"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when]
    languages:
      en:
        inapp:
          title: "Booking cancelled: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}"
          text: "{{ values.when }} · {{ doc.number }}{% if doc.cancellation_reason %} · {{ doc.cancellation_reason }}{% endif %}"
  - key: bookings.staff_seat_filled
    label: "To staff: waitlist seat filled"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when]
    languages:
      en:
        inapp:
          title: "Waitlist seat filled: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}"
          text: "{{ values.when }} · {{ doc.number }}"
  - key: bookings.staff_clash
    label: "To staff: clashes with your calendar"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when]
    languages:
      en:
        inapp:
          title: "Clashes with your calendar: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}"
          text: "{{ values.when }} · {{ doc.number }} · your outside calendar is busy then: reschedule it, or keep it"
  - key: bookings.staff_expired
    label: "To staff: deposit not paid, time released"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when]
    languages:
      en:
        inapp:
          title: "Deposit not paid, time released: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}"
          text: "{{ values.when }} · {{ doc.number }}"
  - key: bookings.staff_reminder
    label: "To staff: a booking is coming up"
    entity: Booking
    category: operational
    channels: [inapp]
    values: [when, class, seats]
    languages:
      en:
        inapp:
          title: "{% if values.class %}Coming up: {{ doc.service_name }} ({{ values.seats }} booked){% else %}Coming up: {{ doc.service_name }} with {% if doc.guest_name %}{{ doc.guest_name }}{% else %}a guest{% endif %}{% endif %}"
          text: "{{ values.when }} · {{ doc.number }}"
